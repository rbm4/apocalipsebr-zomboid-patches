name: Project Zomboid server integration

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested agent as the latest release (default branch only)
        default: false
        type: boolean
      steam_branch:
        description: Steam branch for dedicated server app 380870
        default: public
        type: string
      server_heap:
        description: Maximum server heap (for example 6g or 8g)
        default: 6g
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and run unit tests
    runs-on: ${{ vars.PZ_INTEGRATION_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 110
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      release-version: ${{ steps.version.outputs.release-version }}
      artifact-id: ${{ steps.build-artifact.outputs.artifact-id }}
    env:
      STEAM_BRANCH: ${{ inputs.steam_branch || 'public' }}
      PZ_SERVER_HEAP: ${{ inputs.server_heap || '6g' }}
      EXPECTED_JAR_SHA256: ${{ vars.PZ_LINUX_JAR_SHA256 || '3c4a7c5f149d784758c6fb5f8fa85f3a21d572e38bc081400e89035f8120d287' }}
      EXPECTED_STEAM_BUILD_ID: ${{ vars.PZ_STEAM_BUILD_ID || '26486687' }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set Maven revision
        id: version
        env:
          PUBLISH: ${{ github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || inputs.publish_release) }}
        shell: bash
        run: |
          revision=0.1.0-SNAPSHOT
          if [[ "$PUBLISH" == true ]]; then
            revision="0.1.$GITHUB_RUN_NUMBER"
            printf 'release-version=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'MAVEN_ARGS=-Drevision=%s\n' "$revision" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-pz-integration

      - name: Package integration build
        id: suite
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress -Pserver-integration "-Dpz.game.jar=$PZ_GAME_JAR" package
          cd target
          sha256sum apocbr-agent.jar > apocbr-agent.jar.sha256

      - name: Upload compiled integration build
        id: build-artifact
        uses: actions/upload-artifact@v6
        with:
          name: pz-integration-build-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            target/apocbr-agent.jar
            target/apocbr-agent.jar.sha256
            target/classes/
            target/test-classes/

      - name: Publish unit test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.suite.outcome }}
        shell: bash
        run: python3 tools/summarize-ci-tests.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pz-integration-build-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            target/ci/
            target/surefire-reports/

  players30-baseline:
    needs: build
    uses: ./.github/workflows/server-integration-scenario.yml
    with:
      scenario: players30-baseline
      steam-branch: ${{ inputs.steam_branch || 'public' }}
      server-heap: ${{ inputs.server_heap || '6g' }}
      revision: ${{ needs.build.outputs.revision }}
      build-artifact-id: ${{ needs.build.outputs.artifact-id }}

  independent-scenarios:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.PZ_INTEGRATION_RUNNER && 1 || 5 }}
      matrix:
        scenario: [moving-object-attribution, parked-vehicle-cadence, chunk-lifecycle, hook-rollback, postgres-bootstrap]
    uses: ./.github/workflows/server-integration-scenario.yml
    with:
      scenario: ${{ matrix.scenario }}
      steam-branch: ${{ inputs.steam_branch || 'public' }}
      server-heap: ${{ inputs.server_heap || '6g' }}
      revision: ${{ needs.build.outputs.revision }}
      build-artifact-id: ${{ needs.build.outputs.artifact-id }}

  players30-comparisons:
    needs: [build, players30-baseline]
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.PZ_INTEGRATION_RUNNER && 1 || 3 }}
      matrix:
        scenario: [cell-border, entity-removal-off, los-off]
    uses: ./.github/workflows/server-integration-scenario.yml
    with:
      scenario: ${{ matrix.scenario }}
      steam-branch: ${{ inputs.steam_branch || 'public' }}
      server-heap: ${{ inputs.server_heap || '6g' }}
      revision: ${{ needs.build.outputs.revision }}
      build-artifact-id: ${{ needs.build.outputs.artifact-id }}
      baseline-artifact-id: ${{ needs.players30-baseline.outputs.baseline-artifact-id }}

  publish-release:
    needs: [build, players30-baseline, independent-scenarios, players30-comparisons]
    if: ${{ success() && needs.build.outputs.release-version != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: apocbr-agent-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
        shell: bash
        run: |
          sha256sum --check apocbr-agent.jar.sha256
          tag="agent-v$RELEASE_VERSION"
          published_run="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s '[.[][] | select(.draft == false and .prerelease == false) | .tag_name |
              capture("^agent-v[0-9]+\\.[0-9]+\\.(?<run>[0-9]+)$").run | tonumber] | max // 0')"
          if (( published_run >= GITHUB_RUN_NUMBER )); then
            echo "Agent release run $published_run has already been published."
            exit 0
          fi
          existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" |
            jq -r --arg ref "refs/tags/$tag" '.[] | select(.ref == $ref) | .object.sha')"
          if [[ -n "$existing_tag" && "$existing_tag" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already points to a different commit."
            exit 1
          fi
          gh release create "$tag" apocbr-agent.jar --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "ApocalipseBR Agent $RELEASE_VERSION" --latest \
            --notes "Validated by [integration run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
